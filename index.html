<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Time Loading Bar</title>
    <link rel="manifest" href="/travel-time-loading-bar/manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .bar-container {
            width: 80%;
            margin: 20px auto;
            border: 1px solid #000;
            border-radius: 5px;
            height: 30px;
            overflow: hidden;
        }
        .loading-bar {
            height: 100%;
            background-color: #4caf50;
            text-align: right;
            padding-right: 10px;
            color: white;
            line-height: 30px;
        }
        .bar-header {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .remove-btn {
            margin-left: 10px;
            cursor: pointer;
        }
        #add-bar-btn {
            font-size: 24px;
            padding: 10px 15px;
            margin-top: 20px;
        }
        #form-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
        }
        #new-bar-form {
            background: white;
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h1>Travel Time Loading Bar</h1>
<div id="bars-container"></div>
<button id="add-bar-btn">+</button>

<div id="form-overlay">
    <div id="new-bar-form">
        <div>
            <label>Name: <input type="text" id="bar-name"></label>
        </div>
        <div>
            <label>Start Time: <input type="datetime-local" id="bar-start"></label>
        </div>
        <div>
            <label>End Time: <input type="datetime-local" id="bar-end"></label>
        </div>
        <button id="add-btn" disabled>Add</button>
        <button id="cancel-btn">Cancel</button>
    </div>
</div>

<script>
    const bars = [];
    let draggedBar = null;
    const overlay = document.getElementById('form-overlay');
    const addBtn = document.getElementById('add-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const showBtn = document.getElementById('add-bar-btn');
    const nameInput = document.getElementById('bar-name');
    const startInput = document.getElementById('bar-start');
    const endInput = document.getElementById('bar-end');
    const barsContainer = document.getElementById('bars-container');
    barsContainer.addEventListener('dragover', (e) => e.preventDefault());
    barsContainer.addEventListener('drop', (e) => {
        if (!draggedBar) return;
        e.preventDefault();
        barsContainer.appendChild(draggedBar.wrapper);
        const from = bars.indexOf(draggedBar);
        if (from === -1) return;
        bars.splice(from, 1);
        bars.push(draggedBar);
        saveBars();
    });

    function validateForm() {
        addBtn.disabled = !(nameInput.value && startInput.value && endInput.value);
    }

    nameInput.addEventListener('input', validateForm);
    startInput.addEventListener('input', validateForm);
    endInput.addEventListener('input', validateForm);

    showBtn.addEventListener('click', () => {
        overlay.style.display = 'flex';
    });

    cancelBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        nameInput.value = '';
        startInput.value = '';
        endInput.value = '';
        validateForm();
    });

    function saveBars() {
        const stored = bars.map(b => ({
            name: b.name,
            start: b.start.toISOString(),
            end: b.end.toISOString()
        }));
        localStorage.setItem('bars', JSON.stringify(stored));
    }

    function createBar(name, start, end, save = true) {
        const wrapper = document.createElement('div');
        const header = document.createElement('div');
        header.className = 'bar-header';
        const label = document.createElement('span');
        label.textContent = name;
        const remove = document.createElement('button');
        remove.className = 'remove-btn';
        remove.textContent = '×';
        header.appendChild(label);
        header.appendChild(remove);
        wrapper.appendChild(header);

        const container = document.createElement('div');
        container.className = 'bar-container';
        const barEl = document.createElement('div');
        barEl.className = 'loading-bar';
        barEl.textContent = '0%';
        container.appendChild(barEl);
        wrapper.appendChild(container);

        barsContainer.appendChild(wrapper);

        const barObj = { name, start, end, el: barEl, wrapper };

        wrapper.draggable = true;
        wrapper.addEventListener('dragstart', (e) => {
            draggedBar = barObj;
            wrapper.style.opacity = '0.5';
            e.dataTransfer.effectAllowed = 'move';
        });
        wrapper.addEventListener('dragend', () => {
            draggedBar = null;
            wrapper.style.opacity = '';
        });
        wrapper.addEventListener('dragover', (e) => {
            e.preventDefault();
        });
        wrapper.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!draggedBar || draggedBar === barObj) return;
            const rect = wrapper.getBoundingClientRect();
            const before = e.clientY < rect.top + rect.height / 2;
            const from = bars.indexOf(draggedBar);
            let to = bars.indexOf(barObj);
            if (from === -1 || to === -1) return;
            if (!before) to++;
            if (from < to) to--;
            if (from === to) return;
            bars.splice(from, 1);
            bars.splice(to, 0, draggedBar);
            barsContainer.insertBefore(draggedBar.wrapper, before ? barObj.wrapper : barObj.wrapper.nextSibling);
            saveBars();
        });
        remove.addEventListener('click', () => {
            barsContainer.removeChild(wrapper);
            const idx = bars.indexOf(barObj);
            if (idx !== -1) bars.splice(idx, 1);
            saveBars();
        });

        bars.push(barObj);
        if (save) saveBars();
    }

    function loadBars() {
        try {
            const stored = JSON.parse(localStorage.getItem('bars') || '[]');
            stored.forEach(b => {
                createBar(b.name, new Date(b.start), new Date(b.end), false);
            });
        } catch (e) {
            console.error('Failed to load bars', e);
        }
    }

    addBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name || !startInput.value || !endInput.value) return;

        const start = new Date(startInput.value);
        const end = new Date(endInput.value);

        createBar(name, start, end);

        overlay.style.display = 'none';
        nameInput.value = '';
        startInput.value = '';
        endInput.value = '';
        validateForm();
    });

    function updateBars() {
        const now = new Date();
        bars.forEach(bar => {
            const total = (bar.end - bar.start) / 1000 / 60;
            const elapsed = (now - bar.start) / 1000 / 60;
            const perc = (elapsed / total) * 100;
            const width = Math.min(100, Math.max(0, perc));
            bar.el.style.width = width + '%';
            bar.el.innerText = width.toFixed(2) + '%';
        });
    }

    loadBars();
    setInterval(updateBars, 1000);
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/travel-time-loading-bar/service-worker.js').then(function(registration) {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, function(err) {
            console.log('ServiceWorker registration failed: ', err);
        });
    }
</script>

</body>
</html>
